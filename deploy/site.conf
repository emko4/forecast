# What this repository wants served, read by the server (emko4/server,
# docs/SITES.md):
#
#   <name>  <kind>  <hostname> [<hostname> ...]
#
# The files are in site/; every push to master hands them over as a release
# (.github/workflows/deploy.yml), with the key whose public half is
# deploy.pub beside this file. That key can do nothing else.
#
# Taking a change of this file or of deploy.pub in (as root, from this
# repository's checkout):
#   scp -r deploy root@195.181.211.171:/tmp/declared
#   ssh root@195.181.211.171 'bash /opt/server/site-install.sh forecast /tmp/declared; rm -rf /tmp/declared'

forecast  spa  forecast.kadlec.info forecast.kadlecova.info forecast.kadlec.fi
